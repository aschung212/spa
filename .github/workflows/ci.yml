name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Force GitHub-hosted JS actions onto the Node 24 runtime, declared once for the
# whole workflow so a new job can't silently omit it and drift back to an older
# Node. Job-level `env:` still merges on top of this (see e2e's VITE_E2E).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fast pre-flight: statically validate the workflow YAML itself before any
  # heavy job runs. actionlint catches invalid `needs`/`if` expressions, bad
  # `${{ }}` contexts, unknown action inputs, malformed cron/globs, and (via
  # shellcheck) real bugs in `run:` shell — the class of "typo merged to master
  # breaks all of CI" mistakes that hand-rolled workflow shell is prone to.
  # No `needs:` so it runs immediately in parallel; it finishes in seconds.
  workflow-lint:
    name: Lint workflow YAML (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          fail-on-error: true

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: check-migration-order compares this branch's
          # migrations against origin/master, which a shallow clone lacks.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: restore-nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Self-heal on a cache miss/eviction: the install job's cache can be
      # evicted between jobs (GitHub's 10GB/7-day policy), which would
      # otherwise hard-fail this job with no node_modules. Fall back to a
      # fresh install so a transient miss recovers instead of red-Xing the PR.
      - name: Install dependencies (cache miss)
        if: steps.restore-nm.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run lint

      # Runs HERE, in a PR-visible job, on purpose (LIFT-1280). migrate-db is
      # gated on pushes to master, so an ordering break was undetectable until
      # after merge — and then wedged every subsequent schema push. This is the
      # same guarantee `db push` used to give before --include-all, moved to
      # where it can actually block the bad change.
      - name: Check migration ordering
        run: node scripts/check-migration-order.mjs origin/${{ github.base_ref || 'master' }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: restore-nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss)
        if: steps.restore-nm.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run typecheck

  # Unit/component suite, sharded across a matrix for faster PR feedback.
  # Each shard runs a disjoint slice of the ~120-file suite in parallel and
  # writes a Vitest blob report (which carries this shard's coverage data).
  # The blobs are merged back into a single coverage report in build-and-test,
  # where the ratchet check and PR comments run against the full total.
  #
  # Coverage thresholds are intentionally disabled per shard (a single shard
  # only exercises a subset of the code, so it can never meet the global
  # floor). The thresholds are enforced once, on the merged total, by the
  # `vitest --merge-reports --coverage` step in build-and-test.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: restore-nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss)
        if: steps.restore-nm.outputs.cache-hit != 'true'
        run: npm ci

      # The blob path is pinned, not left to Vitest's default: v5 moved that
      # default from `.vitest-reports/` to `.vitest/blob/`, which silently
      # emptied the upload below and failed the merge in build-and-test. The
      # upload `path` and build-and-test's `--merge-reports=` must name this
      # same directory, and `if-no-files-found: error` makes any future drift
      # fail here, at the shard, instead of two jobs later.
      - name: Run tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: >-
          npx vitest run --coverage --reporter=blob
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shardIndex }}.json
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          --coverage.thresholds.lines=0
          --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: .vitest-reports/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Rendered-page perf/a11y budget gating against the built dist (LIFT-865).
  # Complements the static JS bundle budget in build-and-test with real
  # Core Web Vitals and category scores from Lighthouse. PR-only: it needs a
  # base to compare against and would add cost with no gate on master pushes.
  # lhci is run via a pinned `npx` (not a package.json dep) because it pulls
  # ~250 transitive packages that would bloat the lockfile and trip the
  # dependency-review gate for a tool that only ever runs in CI.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: restore-nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss)
        if: steps.restore-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: restore-nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss)
        if: steps.restore-nm.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run build

      # Fail the production build if the dev sign-in bypass ("Continue as Dev")
      # tree-shakes back in — e.g. VITE_E2E leaked into a prod build or the
      # AuthScreen flag gate was removed (LIFT-1123). This job builds WITHOUT
      # VITE_E2E, so the dev-signin chunk must be absent from dist/.
      - name: Guard against dev sign-in in production bundle
        run: npm run guard:dev-signin

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: ${{ github.event_name == 'push' && 7 || 3 }}

      - name: Restore base bundle sizes (PR)
        if: github.event_name == 'pull_request'
        id: base-bundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: bundle-sizes.json
          key: bundle-sizes-master-${{ github.event.pull_request.base.sha }}
          restore-keys: bundle-sizes-master-

      - name: Preserve base bundle sizes
        if: github.event_name == 'pull_request'
        run: if [ -f bundle-sizes.json ]; then mv bundle-sizes.json base-bundle-sizes.json; fi

      - name: Measure bundle sizes
        id: bundle
        run: |
          # Total JS bundle budget: 640 KB (currently ~597 KB).
          # Sums every emitted JS chunk, so code-splitting does not lower the total —
          # bumped 500 → 550 → 570 → 600 → 640 KB as the app legitimately outgrew each
          # ceiling (last bump: master had drifted to 597 KB, leaving 3 KB of headroom,
          # so the exercise database (#615, +6 KB) and consistency heatmap (#620, +7 KB)
          # both failed the gate on size alone).
          TOTAL_JS=$(find dist/assets -name '*.js' ! -name 'workbox-*' ! -name 'sw.*' -exec wc -c {} + | tail -1 | awk '{print $1}')
          TOTAL_CSS=$(find dist/assets -name '*.css' -exec wc -c {} + | tail -1 | awk '{print $1}')
          TOTAL_CSS=${TOTAL_CSS:-0}
          BUDGET=655360

          echo "js_bytes=$TOTAL_JS" >> "$GITHUB_OUTPUT"
          echo "css_bytes=$TOTAL_CSS" >> "$GITHUB_OUTPUT"
          echo "JS bundle size: $(( TOTAL_JS / 1024 )) KB (budget: $(( BUDGET / 1024 )) KB)"
          echo "CSS bundle size: $(( TOTAL_CSS / 1024 )) KB"

          if [ "$TOTAL_JS" -gt "$BUDGET" ]; then
            echo "::error::Bundle size ($((TOTAL_JS / 1024)) KB) exceeds budget ($((BUDGET / 1024)) KB)"
            exit 1
          fi

          # Save sizes for cross-build comparison
          echo "{\"js\": $TOTAL_JS, \"css\": $TOTAL_CSS}" > bundle-sizes.json

      - name: Save bundle sizes (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-sizes.json
          key: bundle-sizes-master-${{ github.sha }}

      - name: Post bundle size delta comment
        if: always() && github.event_name == 'pull_request' && steps.bundle.outputs.js_bytes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const jsBytes = parseInt('${{ steps.bundle.outputs.js_bytes }}', 10);
            const cssBytes = parseInt('${{ steps.bundle.outputs.css_bytes }}', 10);
            // Keep in sync with BUDGET in the "Measure bundle sizes" step above.
            const budget = 583680;

            let body = '## 📦 Bundle Size Report\n\n';

            // Try to load base branch sizes
            let baseJs = null, baseCss = null;
            try {
              const base = JSON.parse(fs.readFileSync('base-bundle-sizes.json', 'utf8'));
              baseJs = base.js;
              baseCss = base.css;
            } catch {
              // No cached baseline — first run or cache expired
            }

            const fmt = (bytes) => `${(bytes / 1024).toFixed(1)} KB`;
            const delta = (cur, prev) => {
              const diff = cur - prev;
              const sign = diff > 0 ? '+' : '';
              const icon = diff > 0 ? '🔺' : diff < 0 ? '🔽' : '✅';
              return `${icon} ${sign}${fmt(diff)}`;
            };

            body += '| Asset | Size | Budget | Delta |\n';
            body += '|-------|------|--------|-------|\n';

            const jsDelta = baseJs != null ? delta(jsBytes, baseJs) : '—';
            const cssDelta = baseCss != null ? delta(cssBytes, baseCss) : '—';
            const jsPct = ((jsBytes / budget) * 100).toFixed(0);

            body += `| JS | ${fmt(jsBytes)} | ${fmt(budget)} (${jsPct}%) | ${jsDelta} |\n`;
            body += `| CSS | ${fmt(cssBytes)} | — | ${cssDelta} |\n`;

            if (baseJs == null) {
              body += '\n> _No baseline from master yet. Delta will appear after the next master build._\n';
            }

            // Upsert: find existing comment by marker, update or create
            const marker = '<!-- bundle-size-report -->';
            body = marker + '\n' + body;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find(c => c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              // Fork PRs have read-only tokens — log but don't fail the build
              core.warning(`Could not post bundle size comment: ${err.message}`);
            }

      - name: Restore base coverage summary (PR)
        if: github.event_name == 'pull_request'
        id: base-coverage
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: coverage/coverage-summary.json
          key: coverage-summary-master-${{ github.event.pull_request.base.sha }}
          restore-keys: coverage-summary-master-

      - name: Preserve base coverage summary
        if: github.event_name == 'pull_request'
        run: if [ -f coverage/coverage-summary.json ]; then mv coverage/coverage-summary.json base-coverage-summary.json; fi

      - name: Download shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .vitest-reports
          pattern: blob-report-*
          merge-multiple: true

      # Merge the per-shard blobs into a single coverage report. This does NOT
      # re-run the tests — it reconstructs the full coverage total from the
      # blobs and regenerates coverage/coverage-summary.json (+ coverage-final),
      # enforcing the global thresholds from vitest.config.js on the merged total.
      - name: Merge coverage from shards
        run: npx vitest run --merge-reports=.vitest-reports --coverage

      - name: Coverage ratchet check
        run: node scripts/check-coverage-ratchet.js

      - name: Save coverage summary (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage/coverage-summary.json
          key: coverage-summary-master-${{ github.sha }}

      # Hand the freshly-computed summary to ratchet-baseline as a same-run
      # artifact so it never has to re-run the full suite just to regenerate it.
      - name: Upload coverage summary artifact (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 1

      - name: Post coverage delta comment
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const baseline = JSON.parse(fs.readFileSync('.coverage-baseline.json', 'utf8'));
            const metrics = ['statements', 'branches', 'functions', 'lines'];

            let baseFromMaster = null;
            try {
              baseFromMaster = JSON.parse(fs.readFileSync('base-coverage-summary.json', 'utf8'));
            } catch {
              // No cached master summary — first run or cache expired
            }

            const fmt = (n) => `${n.toFixed(2)}%`;
            const delta = (cur, prev) => {
              const diff = cur - prev;
              const sign = diff > 0 ? '+' : '';
              const icon = diff > 2 ? '🟢' : diff > 0 ? '🔵' : diff < -1 ? '🔴' : diff < 0 ? '🟡' : '⚪';
              return `${icon} ${sign}${diff.toFixed(2)}%`;
            };

            let body = '## 🔬 Coverage Ratchet Report\n\n';
            body += '| Metric | Current | Baseline Floor | vs. Master |\n';
            body += '|--------|---------|----------------|------------|\n';

            for (const m of metrics) {
              const cur = summary.total[m].pct;
              const floor = baseline[m];
              const masterDelta = baseFromMaster ? delta(cur, baseFromMaster.total[m].pct) : '—';
              const floorDelta = delta(cur, floor);
              body += `| ${m} | ${fmt(cur)} | ${fmt(floor)} ${floorDelta} | ${masterDelta} |\n`;
            }

            if (!baseFromMaster) {
              body += '\n> _No master coverage cached yet. Delta vs master will appear after the next master build._\n';
            }
            body += '\n> _Floor = `.coverage-baseline.json` — auto-ratchets up on master merge._\n';

            const marker = '<!-- coverage-ratchet-report -->';
            body = marker + '\n' + body;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find(c => c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(`Could not post coverage comment: ${err.message}`);
            }

      - name: Coverage report
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  # Auto-ratchet the coverage baseline on master merges.
  # Runs after all tests pass. If coverage improved, commits the updated
  # .coverage-baseline.json back to master so the floor only ever rises.
  # Uses [skip ci] to prevent an infinite loop.
  ratchet-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      # Reuse the coverage-summary.json that build-and-test already produced
      # instead of re-running the full suite. The ratchet script reads only
      # coverage/coverage-summary.json and Node builtins — no node_modules
      # or test run is needed on this job (LIFT-868).
      - name: Download coverage summary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-summary
          path: coverage

      - name: Ratchet baseline
        run: node scripts/check-coverage-ratchet.js --update

      - name: Commit updated baseline
        run: |
          if git diff --quiet .coverage-baseline.json; then
            echo "Baseline unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .coverage-baseline.json
            git commit -m "chore: ratchet coverage baseline [skip ci]"
            # master is a protected branch and the default GITHUB_TOKEN cannot push to it
            # (rejected with GH006). A blocked auto-commit must NOT fail the whole run:
            # the ratchet's intent (floor only ever rises) is preserved either way —
            # on success the floor rises, and when the push is blocked the floor simply
            # holds at its current value (PRs are still gated against it, never falsely).
            # Long-term fix: push with a PAT / GitHub App token that is in the branch-
            # protection bypass allowlist — set it as a secret and use it as the
            # `token:` on the checkout step above, then this fallback never triggers.
            if git push; then
              echo "Ratcheted coverage baseline committed to master."
            else
              echo "::warning::Coverage baseline could not be pushed to protected master (GH006); floor held. Configure a bypass token to auto-ratchet."
            fi
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    env:
      # Build-time flag: makes the dev sign-in button available in the
      # production bundle so e2e tests can authenticate without Supabase.
      # Real Vercel deploys do not set this, so the button stays hidden.
      VITE_E2E: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: restore-nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss)
        if: steps.restore-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Include the Playwright config in the key so changing the browser
          # set (e.g. adding webkit) busts the cache and reinstalls binaries.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'playwright.config.ts') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Push unapplied Supabase migrations on merge to master.
  # Runs before Vercel deploys so the DB schema is ready for the new code.
  migrate-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v2
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # --include-all, not a bare push (LIFT-1280). `supabase db push` refuses to
      # apply a migration whose timestamp predates the last one already on the
      # remote, and it aborts WITHOUT APPLYING ANYTHING rather than skipping just
      # that file. 20260529000000_add_notes.sql (LIFT-619, #829) landed with such
      # a timestamp, so from 2026-08-29 every master push failed here and no
      # schema change reached production — including
      # 20260830000000_add_attempted_next_rep_to_sets.sql, whose column the
      # shipping client already writes on every set save.
      #
      # The failure was invisible pre-merge because this job is gated on
      # `push` + `refs/heads/master`, so PRs skip it and show fully green. It
      # also silently disabled smoke-test-production and notify-deploy, which
      # need this job — the entire deploy-verification chain from LIFT-1167.
      #
      # Every migration in this repo is additive (`add column if not exists`),
      # so applying an out-of-order one is safe here. If that ever stops being
      # true, renumber the offending file past the remote's last applied
      # migration instead of widening this flag.
      - name: Push migrations
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Verify Vercel actually promoted this commit to production BEFORE claiming
  # a successful deploy (LIFT-1167). Green CI does NOT prove the deploy landed:
  # Vercel builds independently of this workflow and, on a failed build, keeps
  # the PREVIOUS deployment live — so a plain reachability curl answers 200 off
  # the stale deploy and can't tell success from failure. `vite-plugin-version-
  # stamp` writes `/version.json` carrying the built commit SHA, so we poll it
  # until the DEPLOYED commit matches the pushed commit. Only then does
  # notify-deploy (which needs this job) fire; a mismatch/timeout fails this job
  # and routes to notify-failure instead of a falsely-green "Deployed" message.
  # Deliberately does NOT depend on ratchet-baseline: that job pushes a
  # `[skip ci]` coverage-bookkeeping commit to master, and while Vercel skips
  # deploying it (its `ignoreCommand` ignores commits that touch only
  # .coverage-baseline.json), gating on it would needlessly couple deploy
  # verification to coverage bookkeeping and open a SHA-race window. We verify
  # the deploy of THIS push's commit; migrate-db is the last real deploy
  # prerequisite (schema must be live before the new code serves).
  smoke-test-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-test, e2e, migrate-db]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Published so notify-deploy can tell "verified live" from "nothing was
    # deployed" (LIFT-1354). Without it this job succeeds either way and Slack
    # claimed a verified deploy for commits Vercel never built.
    outputs:
      deploy-skipped: ${{ steps.deploy_gate.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^ is needed to evaluate vercel.json's ignoreCommand below.
          fetch-depth: 2

      # Vercel does not deploy every commit. vercel.json's `ignoreCommand`
      # skips any commit that touches ONLY non-deployable paths, so a CI-only,
      # docs-only, or scripts-only push to master never produces a new
      # deployment — and this job, which waits for production to report the
      # pushed SHA, would then spin for 300s and fail on a commit that was
      # never supposed to deploy.
      #
      # That list is a denylist, not an allowlist, since LIFT-1354: an
      # allowlist silently withheld the deploy for anything it forgot to name
      # (it named vite.config.js but none of the build plugins that config
      # imports), whereas a denylist deploys an unrecognised path by default.
      #
      # That is not hypothetical: it is how master went red on 2026-08-31.
      # #1281 changed only .github/ and scripts/, Vercel correctly skipped it,
      # and this job failed waiting for a deploy that would never come. It went
      # unnoticed for months only because migrate-db was failing upstream, so
      # this job had been `skipped` since roughly May and never got to expose
      # the flaw.
      #
      # The ignoreCommand is EXECUTED from vercel.json rather than restated
      # here. Restating it would create a second derivation of one fact, and
      # the two would drift the first time the deployable path list changes —
      # the failure mode called out for cleanup.sh/pr-close-reconcile.sh.
      - name: Skip verification when Vercel skips the deploy
        id: deploy_gate
        run: |
          set -euo pipefail
          IGNORE_CMD=$(jq -r '.ignoreCommand // empty' vercel.json)
          if [ -z "$IGNORE_CMD" ]; then
            echo "no ignoreCommand in vercel.json — every commit deploys; verifying."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only ever run the known-safe form. vercel.json is committed and
          # reviewed, but this job should not become an arbitrary-command sink.
          case "$IGNORE_CMD" in
            "git diff --quiet"*) ;;
            *) echo "::error::Unrecognised ignoreCommand in vercel.json; refusing to eval it: $IGNORE_CMD"; exit 1 ;;
          esac
          # Vercel's contract: exit 0 from ignoreCommand => SKIP the build.
          if bash -c "$IGNORE_CMD"; then
            echo "This commit touches no deployable path, so Vercel skipped it."
            echo "Nothing new will be served; skipping production verification."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The production domain is read from CLAUDE.md, the single authoritative
      # source (the SEV1 rule: never hardcode/fabricate a deployment URL — a
      # hallucinated domain shipped to prod once already, see the SEV1 note).
      - name: Verify production is serving this commit
        if: steps.deploy_gate.outputs.skip != 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DOMAIN=$(grep -m1 -E '^\*\*Live:\*\*' CLAUDE.md \
            | sed -E 's/^\*\*Live:\*\* *([A-Za-z0-9.-]+).*/\1/' || true)
          if [ -z "$DOMAIN" ]; then
            echo "::error::Could not read the deployment domain from CLAUDE.md"
            exit 1
          fi
          URL="https://$DOMAIN"
          echo "Waiting for $URL to report commit $EXPECTED_SHA"

          ATTEMPTS=30
          SLEEP=10
          for i in $(seq 1 "$ATTEMPTS"); do
            # Cache-bust so an edge-cached version.json can't mask a fresh deploy.
            BODY=$(curl -fsS --max-time 15 "$URL/version.json?ci=$RUN_ID-$i" || true)
            DEPLOYED_SHA=$(printf '%s' "$BODY" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ -n "$DEPLOYED_SHA" ] && [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              HTML=$(curl -fsS --max-time 15 "$URL/?ci=$RUN_ID" || true)
              if printf '%s' "$HTML" | grep -q '<div id="app">'; then
                echo "Production is serving commit $EXPECTED_SHA and the app shell renders (attempt $i)."
                exit 0
              fi
              echo "::warning::version.json matched but the app-shell marker is missing; retrying"
            else
              echo "Attempt $i/$ATTEMPTS: deployed=${DEPLOYED_SHA:-<none>} expected=$EXPECTED_SHA — waiting ${SLEEP}s"
            fi
            sleep "$SLEEP"
          done
          echo "::error::Production never reported commit $EXPECTED_SHA within $((ATTEMPTS * SLEEP))s — the Vercel deploy likely failed or stalled"
          exit 1

  # Notify Slack on post-merge success (push to master only).
  #
  # The message BRANCHES on whether a deploy actually happened (LIFT-1354).
  # smoke-test-production skips its verification for a commit Vercel ignores —
  # correctly, since polling for a SHA production will never report would spin
  # 300s and fail — but the job still succeeds, so this step used to post
  # "Deployed to production (verified live)" for a commit that was neither
  # deployed nor verified. That is the same falsely-green claim LIFT-1167
  # exists to eliminate, entering through the skip path rather than the
  # failed-build path. Reporting nothing instead would be worse: silence is
  # indistinguishable from a broken workflow.
  #
  # SECURITY: commit message + URL come in via env var, NOT direct
  # `${{ ... }}` interpolation into the bash body. Inline interpolation
  # is a known GitHub Actions script-injection vector — any commit
  # containing single quotes, parentheses, backticks, or `$(...)`
  # would break the run step (and could execute attacker-controlled
  # shell). See GitHub docs: "Understanding the risk of script injections".
  notify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, test, build-and-test, e2e, migrate-db, ratchet-baseline, smoke-test-production]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          DEPLOY_SKIPPED: ${{ needs.smoke-test-production.outputs.deploy-skipped }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          if [ "$DEPLOY_SKIPPED" = "true" ]; then
            MSG="⏭️ *CI passed — no production deploy* (this commit touches no deployable path, so production still serves the previous commit)\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>"
          else
            MSG="✅ *Deployed to production* (verified live)\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>"
          fi
          payload=$(printf '{"text": %s}' "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"

  # Notify Slack on post-merge failure (push to master only). Same
  # script-injection guard as `notify-deploy` above. Includes
  # smoke-test-production so a failed/stalled Vercel deploy (green CI but the
  # prod URL never serves this commit) surfaces as a failure notification
  # instead of silently withholding any message.
  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, test, build-and-test, e2e, migrate-db, ratchet-baseline, smoke-test-production]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          MSG="🔴 *Post-merge CI failed on master*\nCommit: <${COMMIT_URL}|${COMMIT_MSG}>\nRun: <${RUN_URL}|View logs>"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"
