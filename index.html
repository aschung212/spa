<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    No maximum-scale / user-scalable here: blocking pinch-zoom fails WCAG 2.1 AA
    1.4.4 (Resize Text) and 1.4.10 (Reflow), and the CSS type scale is
    rem-anchored precisely so text CAN scale (see the --font-* block in
    index.css). The lock was silently suppressing iOS Safari's zoom-on-focus,
    so it can only be lifted while every focusable text control computes to at
    least 16px — enforced by the iOS focus-zoom floor test in
    cssRegression.test.ts. Never re-add the lock to "fix" a zooming input;
    raise the input's font-size instead. viewport-fit=cover stays: it is what
    makes env(safe-area-inset-*) resolve on notched devices.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lift" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!--
    iOS PWA launch screens (apple-touch-startup-image). Without these, a cold
    launch from the Home Screen flashes a blank background until the HTML paints.
    Each portrait PNG (generated by scripts/generate-launch-screens.js, matching
    the #splash: Eternal dark bg + gold barbell) is keyed to a device resolution.
  -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/launch/apple-launch-640x1136.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/launch/apple-launch-750x1334.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1242x2208.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1125x2436.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/launch/apple-launch-828x1792.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1242x2688.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1170x2532.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1284x2778.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1179x2556.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1290x2796.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1206x2622.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/apple-launch-1320x2868.png" />

  <!-- Standard -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <meta name="application-name" content="Lift" />
  <meta name="theme-color" content="#0f0f0f" />

  <!-- SEO -->
  <meta name="description" content="A free, open-source PWA workout tracker with unlimited exercises and full history — no paywall. Log sets, track estimated 1RM progress, visualize training history, and hit new PRs — all offline-capable." />
  <!--
    robots.txt controls crawl access; this meta controls SERP presentation.
    max-image-preview:large lets Google render the full og-image as a large rich
    preview beside the result instead of a small thumbnail (or none).
  -->
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://spa-rho-sandy.vercel.app" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Lift — Workout Tracker" />
  <meta property="og:description" content="Log sets, track estimated 1RM progress, and hit new PRs. Unlimited & no paywall — a free, offline-capable PWA." />
  <meta property="og:image" content="https://spa-rho-sandy.vercel.app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="Lift workout tracker — set logging and 1RM progress charts on iPhone." />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://spa-rho-sandy.vercel.app" />
  <meta property="og:site_name" content="Lift" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lift — Workout Tracker" />
  <meta name="twitter:description" content="Log sets, track estimated 1RM progress, and hit new PRs. Unlimited & no paywall — a free, offline-capable PWA." />
  <meta name="twitter:image" content="https://spa-rho-sandy.vercel.app/og-image.png" />
  <meta name="twitter:image:alt" content="Lift workout tracker — set logging and 1RM progress charts on iPhone." />

  <title>Lift — Workout Tracker</title>
</head>
<body>
  <!--
    Resolve persisted theme + mode before the splash paints, so the splash
    background, accent, and skeleton tab bar match the user's real theme.
    Mirrors the boot logic in src/composables/useTheme.ts so data-theme /
    data-mode are set on <html> before JS modules load.
  -->
  <script>
    (function () {
      try {
        var THEME_MIGRATION = {
          graphite: 'amethyst', arctic: 'water', forge: 'pearl',
          aaron: 'luck', tina: 'love', bloom: 'love', metal: 'eternal',
          void: 'eternal', sun: 'pearl', moon: 'midnight', oak: 'earth'
        };
        var VALID_THEMES = ['eternal','pearl','midnight','fire','water','earth','luck','amethyst','air','love'];
        var id = localStorage.getItem('app-theme') || 'eternal';
        if (THEME_MIGRATION[id]) { id = THEME_MIGRATION[id]; localStorage.setItem('app-theme', id); }
        if (VALID_THEMES.indexOf(id) === -1) id = 'eternal';
        document.documentElement.setAttribute('data-theme', id);

        var storedMode = localStorage.getItem('app-mode') || 'auto';
        if (['dark','light','auto'].indexOf(storedMode) === -1) storedMode = 'auto';
        var resolved = storedMode;
        if (resolved === 'auto') {
          resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-mode', resolved);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'eternal');
        document.documentElement.setAttribute('data-mode', 'dark');
      }
    })();
  </script>

  <!--
    Splash screen: paints instantly before JS loads, fades out on Vue mount.
    Layout matches design_handoff_lift_ios_pwa/screens/02-splash.png so the
    handoff to the real Workouts screen is visually seamless. Fallback token
    values are the Luck (dark) palette, used only if the main stylesheet hasn't
    loaded yet (dev mode). Production extracts CSS to a render-blocking <link>,
    so the splash picks up the user's real theme on first paint.
  -->
  <div id="splash" aria-hidden="true">
    <div class="splashMesh"></div>
    <div class="splashContent">
      <div class="splashWordmark">Lift</div>
      <div class="splashLoadingLabel">Loading local data…</div>
    </div>
    <div class="splashTabBar" aria-hidden="true">
      <div class="splashTab splashTabActive">
        <div class="splashTabIcon"></div>
        <div class="splashTabLabel"></div>
      </div>
      <div class="splashTab">
        <div class="splashTabIcon"></div>
        <div class="splashTabLabel"></div>
      </div>
      <div class="splashTab">
        <div class="splashTabIcon"></div>
        <div class="splashTabLabel"></div>
      </div>
    </div>
  </div>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: var(--bg-primary, #0a1210);
      transition: opacity 0.3s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }

    #splash .splashMesh {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: var(--mesh,
        radial-gradient(ellipse 70% 55% at 15% 10%, rgba(30, 120, 70, 0.10) 0%, transparent 65%),
        radial-gradient(ellipse 55% 45% at 85% 80%, rgba(212, 175, 55, 0.06) 0%, transparent 65%));
    }

    #splash .splashContent {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Offset wordmark up 110px (README spec) so the skeleton tab bar sits below. */
      transform: translateY(-110px);
      gap: 8px;
    }

    #splash .splashWordmark {
      font-family: -apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.035em;
      color: var(--accent, #d4af37);
    }

    #splash .splashLoadingLabel {
      font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted, #607868);
    }

    #splash .splashTabBar {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(26px + env(safe-area-inset-bottom, 0px));
      height: 58px;
      border-radius: 20px;
      background: var(--glass-bar, rgba(10, 18, 16, 0.85));
      border: 1px solid var(--glass-edge, rgba(212, 175, 55, 0.10));
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 12px;
    }

    #splash .splashTab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0.5;
    }

    #splash .splashTabIcon {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: var(--border-strong, #2a3e34);
    }

    #splash .splashTabLabel {
      width: 36px;
      height: 6px;
      border-radius: 99px;
      background: var(--border, #1e3028);
    }

    #splash .splashTabActive { opacity: 1; }
    #splash .splashTabActive .splashTabIcon { background: var(--accent, #d4af37); }
    #splash .splashTabActive .splashTabLabel { background: var(--accent-subtle, rgba(212, 175, 55, 0.12)); }

    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
    }
  </style>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
